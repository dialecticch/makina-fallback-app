# Supply chain: actions pinned by full commit SHA, read-only token, no pull_request_target (see README, Dependencies).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory against a locked dependency shows up without a push.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Install, lint, typecheck, test, build, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack (pnpm pinned by hash in package.json)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  abi-check:
    name: ABIs regenerate identically
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Did the ABI inputs change?
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then range="origin/$BASE_REF...HEAD"; else range="$BEFORE...HEAD"; fi
          # When the range cannot be resolved (first push, force push, schedule), check anyway.
          if ! files=$(git diff --name-only "$range" 2>/dev/null); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif echo "$files" | grep -qE '^(scripts/abi-sources\.json|scripts/update-abis\.sh|src/abis/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Foundry version (single source of truth, scripts/abi-sources.json)
        if: steps.changed.outputs.run == 'true'
        id: foundry
        run: echo "version=v$(jq -r .foundry scripts/abi-sources.json)" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        if: steps.changed.outputs.run == 'true'
        with:
          version: ${{ steps.foundry.outputs.version }}
      - name: Regenerate and diff
        if: steps.changed.outputs.run == 'true'
        run: |
          scripts/update-abis.sh
          git diff --exit-code -- src/abis

  fork:
    name: Fork tests and on-chain assumptions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check for fork RPC secrets
        id: secrets
        env:
          HAS_1: ${{ secrets.FORK_RPC_URL_1 != '' }}
          HAS_8453: ${{ secrets.FORK_RPC_URL_8453 != '' }}
        run: |
          if [ "$HAS_1" = "true" ] && [ "$HAS_8453" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork tests skipped: FORK_RPC_URL_1 and FORK_RPC_URL_8453 are not available (forks of this repository do not get secrets)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.secrets.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - name: Foundry version (single source of truth, scripts/abi-sources.json)
        if: steps.secrets.outputs.run == 'true'
        id: foundry
        run: echo "version=v$(jq -r .foundry scripts/abi-sources.json)" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        if: steps.secrets.outputs.run == 'true'
        with:
          version: ${{ steps.foundry.outputs.version }}
      - if: steps.secrets.outputs.run == 'true'
        run: corepack enable
      - if: steps.secrets.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      # Secrets only reach the steps that need them (never the third-party actions above).
      - name: Fork tests
        if: steps.secrets.outputs.run == 'true'
        env:
          FORK_RPC_URL_1: ${{ secrets.FORK_RPC_URL_1 }}
          FORK_RPC_URL_8453: ${{ secrets.FORK_RPC_URL_8453 }}
        run: pnpm test:fork
      - name: Machine discovery still matches the chain (factory pins, nonces vs MachineCreated logs)
        if: steps.secrets.outputs.run == 'true'
        env:
          FORK_RPC_URL_1: ${{ secrets.FORK_RPC_URL_1 }}
          FORK_RPC_URL_8453: ${{ secrets.FORK_RPC_URL_8453 }}
        run: pnpm check-factories
