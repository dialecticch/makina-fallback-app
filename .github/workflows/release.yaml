# Builds a release from a version tag, from the tagged source alone (no .env, no VITE_* variables), and publishes
# dist.tar.gz with its SHA-256 and a build-provenance attestation, so anyone can check a hosted copy against it
# (README, Verify a build).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # `git describe` needs the tags
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: Build (fails if any VITE_* variable is set)
        env:
          RELEASE: "1"
        run: pnpm build
      - name: Package and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Deterministic archive: fixed order, owner and timestamps.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='1970-01-01' -czf "makina-fallback-$TAG.tar.gz" -C dist .
          (cd dist && find . -type f | sort | xargs sha256sum) > "dist-files-$TAG.sha256"
          sha256sum "makina-fallback-$TAG.tar.gz" > "makina-fallback-$TAG.tar.gz.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: makina-fallback-${{ github.ref_name }}.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file CHANGELOG.md \
            "makina-fallback-$TAG.tar.gz" "makina-fallback-$TAG.tar.gz.sha256" "dist-files-$TAG.sha256"
